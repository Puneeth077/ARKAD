<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arkad">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}</style>
<title>Arkad Ledger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Left sidebar on desktop, bottom tab bar with a raised add button on phones, add-entry bottom sheet, one calm page at a time. Bold moment: the green coin-ring balance card. */
:root{
  --bg:#eff3f0; --surface:#ffffff; --surface2:#f6f9f7; --ink:#0d1913; --ink2:#3e4d46; --muted:#6a776f; --line:#e1e8e4; --soft:#e9f0ec;
  --accent:#0a6b55; --accent-ink:#ffffff; --accent-soft:#d9efe6; --gold:#d6a329; --gold-soft:#fbf0d2;
  --h1:#0a4a3c; --h2:#0e7461; --h3:#19a287;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --tint1:#e3eefb; --tint2:#fde9e0; --tint3:#dcf3ea; --tint4:#fbf0d2;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --good:#0ca30c; --good-text:#006300; --good-bg:#e1f4e1;
  --warn:#fab219; --warn-text:#7a5200; --warn-bg:#fff1d0;
  --crit:#d03b3b; --crit-text:#a52b2b; --crit-bg:#fbe3e3;
  --shadow:0 1px 2px rgba(13,25,19,.04),0 10px 28px -14px rgba(13,25,19,.16);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080d0b; --surface:#121a16; --surface2:#17211d; --ink:#ecf3ef; --ink2:#bcc8c1; --muted:#87938c; --line:#212c26; --soft:#1a2520;
    --accent:#3fc3a3; --accent-ink:#04120d; --accent-soft:#143429; --gold:#e5b43c; --gold-soft:#3a2f12;
    --h1:#0c3329; --h2:#0f6553; --h3:#16866f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --tint1:#15283f; --tint2:#3a1f14; --tint3:#123228; --tint4:#3a2f12;
    --grid:#2c2c2a; --axis:#383835;
    --good-text:#4fcf4f; --good-bg:#14301a; --warn-text:#fab219; --warn-bg:#3a2e10; --crit-text:#f08080; --crit-bg:#3c1b1b;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080d0b; --surface:#121a16; --surface2:#17211d; --ink:#ecf3ef; --ink2:#bcc8c1; --muted:#87938c; --line:#212c26; --soft:#1a2520;
  --accent:#3fc3a3; --accent-ink:#04120d; --accent-soft:#143429; --gold:#e5b43c; --gold-soft:#3a2f12;
  --h1:#0c3329; --h2:#0f6553; --h3:#16866f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --tint1:#15283f; --tint2:#3a1f14; --tint3:#123228; --tint4:#3a2f12;
  --grid:#2c2c2a; --axis:#383835;
  --good-text:#4fcf4f; --good-bg:#14301a; --warn-text:#fab219; --warn-bg:#3a2e10; --crit-text:#f08080; --crit-bg:#3c1b1b;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:15px;font-weight:700;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .sm{font-size:13px} .num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;min-width:0;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 12px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{font-size:12px;color:var(--muted)}
.ng{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 12px 4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:12px;background:none;font-weight:600;font-size:14.5px;color:var(--ink2);text-align:left}
.nv:hover{background:var(--soft)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.sidefoot{margin-top:auto;display:grid;gap:8px;padding:12px 8px 0}
.save{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.save i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.save.warn i{background:var(--warn)}
.main{min-width:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar h1{font-size:26px;font-weight:800;letter-spacing:-.025em;flex:1 1 auto;min-width:0}
.mbrand{display:none;align-items:center;gap:8px}
.mnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.mnav .m{min-width:122px;text-align:center;font-weight:700;font-size:14px}
.iconbtn{width:34px;height:34px;border-radius:10px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--ink2)}
.iconbtn:hover{background:var(--soft)}
.view{display:grid;gap:16px;min-width:0}

/* tab bar (phone) */
.tabbar{display:none}
.fab{border:0;background:linear-gradient(135deg,var(--h2),var(--h3));color:#fff;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(10,107,85,.6)}
.fab .ic{width:26px;height:26px}
.addtop{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:0 16px;height:42px;font-weight:700;background:linear-gradient(135deg,var(--h2),var(--h3));color:#fff}
.addtop .ic{width:18px;height:18px}
@media (max-width:959px){
  .app{grid-template-columns:minmax(0,1fr);gap:0;padding-block:14px 112px}
  .side{display:none}
  .mbrand{display:flex}
  .bar h1{font-size:22px;flex-basis:100%;order:3}
  .addtop{display:none}
  .mnav{order:2;margin-left:auto}
  .mbrand{order:1}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tb-i{display:grid;justify-items:center;gap:2px;border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
  .tb-i[aria-current="page"]{color:var(--accent)}
  .tabbar .fab{justify-self:center;margin-top:-26px}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hint{margin:-6px 0 12px;font-size:13px;color:var(--muted)}
.hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,var(--h1),var(--h2) 62%,var(--h3));border-radius:26px;padding:22px}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:250px;height:250px;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);box-shadow:0 0 0 28px rgba(255,255,255,.045),0 0 0 58px rgba(255,255,255,.03)}
.hero>*{position:relative}
.hh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hl{font-size:13px;font-weight:600;opacity:.85}
.gp{font-size:12px;font-weight:700;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px}
.big{font-size:clamp(44px,8vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 10px}
.big.neg{color:#ffd0d0}
.accs{display:flex;gap:10px;flex-wrap:wrap}
.accs span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);border-radius:12px;padding:6px 12px;font-size:13.5px}
.accs b{font-weight:800;font-variant-numeric:tabular-nums}
.hs{font-size:12px;opacity:.8;margin:16px 0 8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.gls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gl{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;min-width:0}
.gl span{display:block;font-size:12px;opacity:.8}
.gl b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.tile .tb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.tb.t1{background:var(--tint1);color:var(--s1)} .tb.t2{background:var(--tint2);color:var(--s2)} .tb.t3{background:var(--tint3);color:var(--s3)} .tb.t4{background:var(--tint4);color:var(--gold)}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:1px 0;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* controls */
.ctl{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;min-width:0;width:100%}
.ctl:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.ctl{height:auto;padding:10px 12px;resize:vertical}
.btn{height:44px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 20px;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--crit);color:#fff}
.linkbtn{background:none;border:0;padding:4px 8px;color:var(--accent);font-weight:700;font-size:13px;border-radius:8px}
.linkbtn:hover{background:var(--accent-soft)}
.invalid{border-color:var(--crit)!important}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);min-height:34px}
.chip .ic{width:16px;height:16px;color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:hover{border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 2px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.g{background:var(--good-bg);color:var(--good-text)} .pill.w{background:var(--warn-bg);color:var(--warn-text)} .pill.c{background:var(--crit-bg);color:var(--crit-text)} .pill.n{background:var(--soft);color:var(--muted)}
.xbtn{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:10px;font-size:18px;line-height:1;flex:none;display:grid;place-items:center}
.xbtn:hover{background:var(--crit-bg);color:var(--crit-text)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* banners */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:18px;padding:12px 14px}
.banner .bi{width:34px;height:34px;border-radius:11px;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none}
.banner p{margin:0;flex:1 1 240px;font-size:14px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner.sample{background:var(--warn-bg)}
.banner.sample .bi{color:var(--warn-text)}

/* meters, lists */
.mrow{display:grid;gap:6px;padding:9px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mhead b{font-weight:700}
.mval{display:flex;gap:8px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;border-radius:6px;background:var(--soft)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--s1),var(--s1))}
.fill.g{background:var(--s3)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;opacity:.65}
.mnote{font-size:12.5px;color:var(--muted)}
.list{display:grid;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:11px 0;align-items:start}
.list li+li{border-top:1px solid var(--line)}
.list .t{font-weight:700}
.list .d{grid-column:2;color:var(--ink2);font-size:14px}
.cures li{grid-template-columns:minmax(0,1fr) auto}
.cures .d{grid-column:1/-1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:11px;fill:var(--muted);font-family:var(--font)}
.axl{font-size:11.5px;fill:var(--ink2);font-family:var(--font);font-weight:700}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(90px,132px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.brow .bt{height:14px;position:relative;background:var(--soft);border-radius:0 7px 7px 0}
.brow .bf{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 7px 7px 0;min-width:3px}
.brow .bv{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.brow .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delta{font-size:12px;font-weight:700;margin-left:6px}
.delta.up{color:var(--crit-text)} .delta.dn{color:var(--good-text)}
.stack{display:flex;gap:2px;height:18px}
.stack i{display:block;height:100%;border-radius:4px;min-width:3px}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}

/* activity rows */
.dg{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0}
.tr+.tr{border-top:1px solid var(--line)}
.ti{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.ti.exp{background:var(--tint2);color:var(--s2)} .ti.inc{background:var(--tint3);color:var(--s3)} .ti.inv{background:var(--tint1);color:var(--s1)} .ti.emi{background:var(--tint4);color:var(--gold)} .ti.xfer,.ti.adj{background:var(--soft);color:var(--ink2)}
.t1{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ta.pos{color:var(--good-text)}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}

/* tables, forms */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:6px 10px 6px 0;white-space:nowrap}
td{padding:10px 10px 10px 0;border-top:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right;padding-right:0;padding-left:10px}
td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
td input.ctl,td select.ctl{height:36px;width:118px;text-align:right}
td select.ctl{text-align:left;width:98px}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:end}
.form label,.fl{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:700;min-width:0}
.form .wide{grid-column:span 2}
.set{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto auto;gap:10px;align-items:center}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,.7fr) auto;gap:10px;align-items:center}

/* goals, loans */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gc h3,.loan h3{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gc .row,.loan .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:10px 0 8px;flex-wrap:wrap}
.bal{font-size:28px;font-weight:800;letter-spacing:-.025em}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:12px 0;font-size:13.5px}
.meta span{color:var(--muted);display:block;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inl{display:flex;gap:8px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}.bub ul{margin:4px 0 6px;padding-left:18px}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--soft);color:var(--ink);border-bottom-left-radius:4px}
.bub.err{border:1px solid var(--warn-text)}
.inl .ctl{flex:1;min-width:0}
.inl .ctl{height:36px}

/* sheets */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(5,12,9,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:94vh;max-height:94dvh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;display:grid;gap:14px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:26px}}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{font-size:18px;font-weight:800}
.amtbig{position:relative;display:block}
.amtbig span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:28px;font-weight:700;color:var(--muted)}
.amtbig input{height:70px;border:1px solid var(--line);border-radius:18px;background:var(--surface2);width:100%;padding:0 16px 0 44px;font-size:36px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amtbig input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.accrow{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.more{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.more summary{font-weight:700;font-size:14px;cursor:pointer}
.more[open] summary{margin-bottom:10px}
.more>div{display:grid;gap:10px}
.sf{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mgrid button{display:grid;justify-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line);background:var(--surface2);border-radius:16px;font-weight:700;font-size:13px;color:var(--ink2)}
.mgrid button .ic{width:24px;height:24px;color:var(--accent)}
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px}
.lbox{display:grid;gap:12px;justify-items:center;text-align:center;width:min(320px,100%)}
.lbox input{text-align:center;font-size:24px;letter-spacing:.4em;height:54px}
.lerr{color:var(--crit-text);font-size:13px;min-height:18px}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.45;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:100;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;padding:0}
@media (min-width:960px){.toast{bottom:28px}}

@media (max-width:959px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.cards{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .wide{grid-column:1/-1}
  .rrow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .gls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .brow{grid-template-columns:minmax(72px,100px) minmax(0,1fr) auto}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* proofs and photos */
.tact{display:flex;align-items:center;gap:2px}
.pbadge{border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:11.5px;border-radius:99px;padding:3px 9px;display:inline-flex;gap:4px;align-items:center}
.pbadge .ic{width:13px;height:13px}
.photorow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photorow label.btn{cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.prev{display:flex;gap:8px;flex-wrap:wrap}
.prev span{position:relative}
.prev img{width:48px;height:48px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.prev button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;line-height:1;padding:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface2);display:grid;align-content:start;min-width:0}
.pcard .th{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--soft);display:block;border:0;padding:0;cursor:pointer}
.pcard .pc{padding:10px 12px;display:grid;gap:2px;min-width:0}
.pcard .pc b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{position:fixed;inset:0;z-index:95;background:rgba(5,12,9,.9);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));color:#fff}
.pv .pvh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pv .pvh .iconbtn{color:#fff}
.pv .pvh .iconbtn:hover{background:rgba(255,255,255,.15)}
.pv .pvm{display:grid;place-items:center;min-height:0}
.pv img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.pv .pvf{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;text-align:center}
.pv .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
</style>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const TODAY=new Date(),THIS=mk(TODAY),TODAYS=ymd(TODAY);
const shiftKey=(k,n)=>{const p=k.split('-').map(Number);return mk(new Date(p[0],p[1]-1+n,1))};
const monthName=(k,short)=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-IN',short?{month:'short'}:{month:'long',year:'numeric'})};
const dim=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1],0).getDate()};
const lastKeys=(k,n)=>Array.from({length:n},(_,i)=>shiftKey(k,i-n+1));
const diffM=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return (y[0]-x[0])*12+(y[1]-x[1])};

function mstat(k){
  const s={inc:0,exp:0,emi:0,inv:0,pass:0,wants:0,need:0,oth:0,cat:{},n:ents(k).length};
  ents(k).forEach(e=>{
    if(e.t==='inc'){s.inc+=e.a;if(e.p)s.pass+=e.a}
    else if(e.t==='exp'){s.exp+=e.a;s.cat[e.c]=(s.cat[e.c]||0)+e.a;const kd=KIND[e.c];if(kd==='want')s.wants+=e.a;else if(kd==='need'||kd==='grow')s.need+=e.a;else s.oth+=e.a}
    else if(e.t==='emi')s.emi+=e.a;
    else if(e.t==='inv')s.inv+=e.a;
  });
  s.kept=s.inc-s.exp-s.emi;return s;
}
function invByType(){

function totals(){
  const t={inc:0,exp:0,emi:0,inv:0};
  Object.keys(S.months).forEach(k=>{const s=mstat(k);t.inc+=s.inc;t.exp+=s.exp;t.emi+=s.emi;t.inv+=s.inv});

  t.bank=S.settings.banks.reduce((a,b)=>a+acc[b.id],0);t.acc=acc;t.net=t.bank+acc.cash;t.kept=t.inc-t.exp-t.emi;

  t.loan=S.settings.loans.reduce((a,l)=>a+l.balance,0);t.loanEmi=S.settings.loans.reduce((a,l)=>a+(l.balance>0?l.emi:0),0);

function loanInfo(l){

  if(l.balance<=0)n=0;else if(l.emi>0){if(r===0)n=Math.ceil(l.balance/l.emi);else{const x=1-l.balance*r/l.emi;n=x<=0?null:Math.ceil(-Math.log(x)/Math.log(1+r))}}
  return {n:n,interest:n!=null?Math.max(0,n*l.emi-l.balance):null};

function amort(bal,rate,emi,extra,lump){
  let b=Math.max(0,bal-(lump||0));const r=rate/1200,pay=emi+(extra||0);let n=0,int=0;const rows=[];
  if(b<=0.5)return {n:0,int:0,rows:rows,ok:true};
  while(b>0.5&&n<600){
    const i=b*r;if(pay<=i+0.01)return {n:null,int:null,rows:rows,ok:false};
    const pr=Math.min(b,pay-i);b-=pr;int+=i;n++;rows.push({n:n,i:i,pr:pr,pay:pr+i,b:Math.max(0,b)});
  }
  return {n:n,int:int,rows:rows,ok:true};
}

function xirr(flows){
  if(flows.length<2)return null;
  flows=flows.slice().sort((a,b)=>a.d-b.d);
  if(!(flows.some(f=>f.a<0)&&flows.some(f=>f.a>0)))return null;
  if((flows[flows.length-1].d-flows[0].d)/864e5<90)return null;
  const t0=flows[0].d,yrs=f=>(f.d-t0)/31557600000,npv=r=>flows.reduce((s,f)=>s+f.a/Math.pow(1+r,yrs(f)),0);
  let lo=-0.95,hi=10,flo=npv(lo);const fhi=npv(hi);if(flo*fhi>0)return null;
  for(let i=0;i<120;i++){const mid=(lo+hi)/2,fm=npv(mid);if(Math.abs(fm)<1e-6)return mid;if(flo*fm<0){hi=mid}else{lo=mid;flo=fm}}
  return (lo+hi)/2;
}

  {const out=s.exp+s.emi;

    else C(5,'Make thy property earn',2,'No rental or passive income logged this month. A second source of income is the surest way up.')}
  {const c=S.settings.cover,cnt=(c.term?1:0)+(c.health?1:0)+(c.retire?1:0);

  {const learn=s.cat['Learning']||0,avg=prev.length?prev.reduce((a,x)=>a+x.inc,0)/prev.length:0;
    if(learn>0)C(7,'Increase thy ability to earn',0,'Spent '+INR(learn)+' on learning this month.');
    else if(avg>0&&s.inc>avg*1.03)C(7,'Increase thy ability to earn',0,'Income is up '+pc(s.inc/avg-1)+' on your recent average.');
    else C(7,'Increase thy ability to earn',1,'Nothing spent on learning. A skill, a certification or a course toward your own venture usually repays more than any other expense.')}
  const spikes=[];
  if(prev.length)Object.keys(s.cat).forEach(c=>{const avg=prev.reduce((a,x)=>a+(x.cat[c]||0),0)/prev.length,d=s.cat[c]-avg;if(avg>0&&s.cat[c]>avg*1.3&&d>=500)spikes.push([c,s.cat[c],avg,d])});
  spikes.sort((a,b)=>b[3]-a[3]).slice(0,2).forEach(x=>extras.push({title:x[0]+' is running high',sev:1,text:INR(x[1])+' so far, '+pc(x[1]/x[2]-1)+' above your usual '+INR(x[2])+'. Cap it for the rest of the month.'}));
  if(hasInc&&s.emi>0){const r=s.emi/s.inc,hi=S.settings.loans.filter(l=>l.balance>0).sort((a,b)=>b.rate-a.rate)[0];
    if(r>.2)extras.push({title:'EMIs are heavy',sev:r>.4?2:1,text:'EMIs take '+pc(r)+' of income, above the 20% share Arkad gave to debts.'+(hi?' Put spare cash on "'+esc(hi.name)+'" ('+hi.rate+'%) first.':'')+' Avoid new loans for now.'})}
  if(hasInc&&s.wants/s.inc>.3)extras.push({title:'Wants are above 30%',sev:1,text:'Eating out, shopping, entertainment, subscriptions, travel and festivals add up to '+pc(s.wants/s.inc)+' of income ('+INR(s.wants)+').'});
  const TA=T.acc;
  if(TA.cash<-0.5)extras.push({title:'Cash in hand is below zero',sev:1,text:'Logged cash spending is '+INR(-TA.cash)+' more than the cash you have recorded. Log a bank withdrawal with Move, or match the ledger to the cash you counted in Settings.'});
  S.settings.banks.forEach(b=>{if(TA[b.id]<-0.5)extras.push({title:esc(b.name)+' balance is below zero',sev:2,text:'Logged payments exceed the recorded balance of '+esc(b.name)+' by '+INR(-TA[b.id])+'. Check its opening balance in Settings, log a missing deposit, or move money in with Move.'})});
  const BG=S.settings.budgets||{};
  Object.keys(BG).forEach(c=>{const lim=+BG[c];if(lim>0&&(s.cat[c]||0)>lim)extras.push({title:c+' is over budget',sev:1,text:INR(s.cat[c])+' spent against a limit of '+INR(lim)+', which is '+INR(s.cat[c]-lim)+' over.'})});
  if(hasInc&&prev.length){
    const ai=prev.reduce((a,x)=>a+x.inc,0)/prev.length,asp=prev.reduce((a,x)=>a+x.exp+x.emi,0)/prev.length,sp=s.exp+s.emi;
    if(ai>0&&asp>0&&s.inc>=ai*1.03&&sp>=asp*1.03&&sp/asp>s.inc/ai)extras.push({title:'Lifestyle is rising with income',sev:1,text:'Income is up '+pc(s.inc/ai-1)+' but spending is up '+pc(sp/asp-1)+'. Send at least half of the extra '+INR(s.inc-ai)+' straight into investments.'});
  }
  S.settings.goals.forEach(g=>{const c=goalCalc(g);if(c.st==='behind'||c.st==='overdue')extras.push({title:g.name+(c.st==='overdue'?' is overdue':' is behind'),sev:1,text:'Saved '+INR(g.saved)+' of '+INR(g.target)+'. Set aside about '+INR(c.need)+' a month to land it by '+monthName(g.by)+'.'})});
  if(cur){const days=ents(k).filter(e=>e.t!=='inc').map(e=>+e.d.slice(8)),last=days.length?Math.max.apply(null,days):0;if(dom-last>=3&&dom>3)extras.push({title:'Ledger is going quiet',sev:1,text:(last?'Nothing logged since the '+last+'th.':'Nothing logged yet this month.')+' A quick entry now keeps the picture true.'})}
  const all=cures.filter(c=>c.sev>=1).concat(extras).sort((a,b)=>b.sev-a.sev);
  return {cures:cures,sugg:all};
}
function goalCalc(g){
  const left=Math.max(0,g.target-g.saved),by=g.by||THIS,ml=Math.max(1,diffM(THIS,by)+1);
  const start=g.start||THIS,total=Math.max(1,diffM(start,by)+1),elapsed=Math.min(total,Math.max(0,diffM(start,THIS)+1));
  const expected=g.target*elapsed/total;
  const st=g.saved>=g.target?'done':(by<THIS?'overdue':(g.saved>=expected*0.95?'ok':'behind'));
  return {left:left,ml:ml,need:left/ml,st:st,pct:g.target>0?Math.min(1,g.saved/g.target):0};
}

/* ---------- GitHub sync (standalone app) ---------- */
const GH={cfg:null,sha:{},dirty:new Set(),busy:false,err:'',last:0,chain:Promise.resolve(),timer:null};
GH.read=()=>{try{GH.cfg=JSON.parse(localStorage.getItem('arkad-gh')||'null')}catch(e){GH.cfg=null}return GH.cfg};
GH.on=()=>!!(GH.cfg&&GH.cfg.token&&GH.cfg.owner&&GH.cfg.repo);
GH.run=fn=>{const r=GH.chain.then(fn);GH.chain=r.catch(()=>{});return r};
const ghPending=()=>{try{return JSON.parse(localStorage.getItem('arkad-gh-dirty')||'[]')}catch(e){return []}};
const ghPersist=()=>{try{localStorage.setItem('arkad-gh-dirty',JSON.stringify(Array.from(GH.dirty)))}catch(e){}};
async function ghReq(method,path,body,raw){
  const c=GH.cfg,url='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+(path==null?'':'/contents/'+path);
  const h={'Authorization':'Bearer '+c.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(body)h['Content-Type']='application/json';
  const res=await fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!res.ok){const e=new Error('github '+res.status);e.status=res.status;throw e}
  return res;
}
const bufB64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const strB64=s=>bufB64(new TextEncoder().encode(s));
async function ghPutFile(path,b64,msg){
  const put=async sha=>{const r=await ghReq('PUT',path,{message:msg,content:b64,sha:sha||undefined});return (await r.json()).content.sha};
  try{return await put(GH.sha[path])}
  catch(e){
    if(e.status===409||e.status===422){let sha;try{sha=(await (await ghReq('GET',path)).json()).sha}catch(x){}return await put(sha)}
    throw e;
  }
}
function ghMark(id){GH.dirty.add(id);ghPersist();clearTimeout(GH.timer);GH.timer=setTimeout(ghFlush,500);setSaveState(true)}
function ghFlush(){
  if(!GH.on()||GH.busy||!GH.dirty.size)return;
  GH.busy=true;setSaveState(true);
  return GH.run(async()=>{
    while(GH.dirty.size){
      const id=GH.dirty.values().next().value;GH.dirty.delete(id);
      try{const path='data/'+id+'.json';GH.sha[path]=await ghPutFile(path,strB64(JSON.stringify(docFor(id))),'Update '+id);ghPersist()}
      catch(e){GH.dirty.add(id);ghPersist();GH.err=(e.status===401||e.status===403||e.status===404)?'auth':'net';throw e}
    }
    GH.err='';GH.last=Date.now();
  }).catch(()=>{}).finally(()=>{
    GH.busy=false;setSaveState(true);
    if(GH.dirty.size){clearTimeout(GH.timer);GH.timer=setTimeout(ghFlush,GH.err==='auth'?60000:15000)}
  });
}
async function ghList(){
  try{const a=await (await ghReq('GET','data')).json();return Array.isArray(a)?a.filter(f=>/\.json$/.test(f.name)):[]}
  catch(e){if(e.status===404)return [];throw e}
}
const ghDoc=async f=>(await ghReq('GET',f.path,null,true)).json();
async function ghLoadAll(){
  const list=await ghList(),docs={};
  for(let i=0;i<list.length;i+=6)await Promise.all(list.slice(i,i+6).map(async f=>{docs[f.name.replace(/\.json$/,'')]=await ghDoc(f);GH.sha[f.path]=f.sha}));
  return docs;
}
async function ghRefresh(force){
  if(!GH.on()||GH.busy||GH.dirty.size||S.saving||!S.settings)return;
  if(!force&&Date.now()-GH.last<45000)return;
  try{
    const list=await ghList();let changed=false;
    for(const f of list){
      const id=f.name.replace(/\.json$/,'');
      if(GH.sha[f.path]===f.sha||GH.dirty.has(id))continue;
      const doc=await ghDoc(f);GH.sha[f.path]=f.sha;
      if(id==='settings')S.settings=mergeSettings(doc);else if(id.indexOf('m-')===0)S.months[id.slice(2)]=doc.entries||[];else continue;
      try{localStorage.setItem('arkad:'+id,JSON.stringify(doc))}catch(e){}
      changed=true;
    }
    GH.last=Date.now();GH.err='';setSaveState(true);
    if(changed&&!S.sheet&&S.unlocked!==false)render();
  }catch(e){GH.err=(e.status===401||e.status===403)?'auth':'net';setSaveState(true)}
}
async function ghConnect(cfg){
  const old=GH.cfg;GH.cfg=cfg;
  try{
    const info=await (await ghReq('GET',null)).json();
    if(!info.private){GH.cfg=old;return {err:'That repository is public. Make it private first, because it will hold your money data.'}}
    if(info.permissions&&info.permissions.push===false){GH.cfg=old;return {err:'The token can read this repository but not write to it. Give it Contents: Read and write.'}}
    const list=await ghList();
    return {ok:true,hasData:list.some(f=>f.name==='settings.json')};
  }catch(e){
    GH.cfg=old;
    return {err:e.status===401?'GitHub rejected the token. Check that you pasted all of it.':(e.status===404||e.status===403)?'Repository not found, or the token has no access to it.':'Could not reach GitHub. Check your internet connection.'};
  }
}
function ghStore(cfg){try{localStorage.setItem('arkad-gh',JSON.stringify(cfg))}catch(e){}GH.cfg=cfg;GH.sha={};GH.err=''}
async function ghAdopt(){
  const docs=await ghLoadAll();
  try{Object.keys(localStorage).filter(k=>k.indexOf('arkad:m-')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}
  S.months={};Object.keys(docs).forEach(id=>{if(id.indexOf('m-')===0)S.months[id.slice(2)]=docs[id].entries||[];try{localStorage.setItem('arkad:'+id,JSON.stringify(docs[id]))}catch(e){}});
  S.settings=mergeSettings(docs.settings);S.unlocked=!S.settings.pin;GH.last=Date.now();
}

}

/* ---------- charts ---------- */
function niceStep(raw){if(!(raw>0))return 1;const mag=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,2.5,5,10].find(m=>m*mag>=raw)*mag}
function niceMax(v){return v>0?niceStep(v/4)*4:4000}
function barPath(x,y,w,h){const r=Math.min(4,h,w/2);return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
function barsSvg(el,labels,series,o){
  const W=Math.max(280,el.clientWidth||520),H=o.h||230,pl=44,pr=6,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb,n=labels.length,ns=series.length;
  const mx=niceMax(Math.max.apply(null,[0].concat.apply([],series.map(s=>s.vals))));
  const y=v=>pt+ih-(v/mx)*ih,band=iw/n,bw=Math.max(5,Math.min(20,(band-12)/ns-2)),grp=ns*bw+(ns-1)*2;
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(i===0?'var(--axis)':'var(--grid)')+'"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end" class="ax">'+axisFmt(v)+'</text>'}
  for(let i=0;i<n;i++){
    const cx=pl+band*i+band/2,x0=cx-grp/2;
    series.forEach((s,j)=>{const v=s.vals[i];if(v>0)g+='<path d="'+barPath(x0+j*(bw+2),y(v),bw,pt+ih-y(v))+'" fill="var('+s.color+')"/>'});
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" class="'+(i===o.hl?'axl':'ax')+'">'+esc(labels[i])+'</text>';
    g+='<rect x="'+(pl+band*i)+'" y="'+pt+'" width="'+band+'" height="'+ih+'" fill="transparent" data-tip="'+esc(o.tip(i))+'"/>';
  }
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Bar chart')+'">'+g+'</svg>';
}
function lineSvg(el,labels,vals,o){
  const def=vals.filter(v=>v!=null&&isFinite(v));
  if(!def.length){el.innerHTML='<div class="empty">'+(o.empty||'No data yet.')+'</div>';return}
  const W=Math.max(280,el.clientWidth||520),H=o.h||230,pl=o.pl||46,pr=16,pt=26,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  let lo=Math.min.apply(null,def),hi=Math.max.apply(null,def);
  if(o.target!=null){lo=Math.min(lo,o.target);hi=Math.max(hi,o.target)}
  if(o.zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}
  if(hi<=lo)hi=lo+1;
  const step=niceStep((hi-lo)/4);lo=Math.floor(lo/step+1e-9)*step;hi=Math.ceil(hi/step-1e-9)*step;
  const y=v=>pt+ih-((v-lo)/(hi-lo))*ih,band=iw/labels.length,x=i=>pl+band*(i+.5),col='var('+(o.color||'--s1')+')',fmt=o.fmt||axisFmt;
  let g='';
  for(let v=lo,c=0;v<=hi+step/2&&c<14;v+=step,c++){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(Math.abs(v)<step/100?'var(--axis)':'var(--grid)')+'"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end" class="ax">'+fmt(Math.round(v*100)/100)+'</text>'}
  if(o.target!=null)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(o.target)+'" y2="'+y(o.target)+'" stroke="var(--accent)" stroke-width="1.5"/><text x="'+(W-pr)+'" y="'+(y(o.target)-5)+'" text-anchor="end" class="ax" style="fill:var(--accent);font-weight:700">'+esc(o.targetLabel||'target')+'</text>';
  let d='';vals.forEach((v,i)=>{if(v==null)return;d+=(d&&vals[i-1]!=null?'L':'M')+x(i)+','+y(v)});
  g+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  const lastIdx=vals.reduce((a,v,i)=>v!=null?i:a,-1);
  vals.forEach((v,i)=>{
    g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" class="'+(i===o.hl?'axl':'ax')+'">'+esc(labels[i])+'</text>';
    if(v!=null){g+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>';
      if(i===lastIdx||i===o.hl)g+='<text x="'+x(i)+'" y="'+(y(v)-10)+'" text-anchor="middle" class="axl">'+esc(o.pt?o.pt(v):fmt(v))+'</text>'}
    g+='<rect x="'+(pl+band*i)+'" y="'+pt+'" width="'+band+'" height="'+ih+'" fill="transparent" data-tip="'+esc(o.tip(i))+'"/>';
  });
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Line chart')+'">'+g+'</svg>';
}
function drawCash(){

function drawYear(){

/* ---------- forecast ---------- */
function forecast(){
  const st=S.settings,F=st.forecast||{},ov=(v,d)=>(v===''||v==null||!isFinite(+v))?d:+v;
  const src=st.income.reduce((a,x)=>a+(+x.amt||0),0);
  const prev=prevStats(THIS,3),cur=mstat(THIS),base=prev.length?prev:[cur];
  let avgSp=base.reduce((a,x)=>a+x.exp,0)/base.length;
  const avgInv=base.reduce((a,x)=>a+x.inv,0)/base.length;
  const recur=(st.recur||[]).reduce((a,x)=>a+(+x.amt||0),0),bud=Object.values(st.budgets||{}).reduce((a,x)=>a+(+x||0),0);
  let spNote='your recent average';
  if(!(avgSp>0)){avgSp=Math.max(recur,bud);spNote=avgSp>0?'your commitments and budgets':'nothing logged yet'}
  const inc=ov(F.inc,src),sp=ov(F.sp,avgSp),inv=ov(F.inv,avgInv);
  const T=totals();let bal=T.net;
  const rows=[{k:THIS,lbl:monthName(THIS,true),full:monthName(THIS),bal:bal,inc:0,out:0}];
  for(let i=1;i<=6;i++){
    const k=shiftKey(THIS,i);
    const emi=st.loans.reduce((a,l)=>{const n=loanInfo(l).n;return a+((n!=null&&i<=n)||n==null&&l.balance>0?(l.balance>0?l.emi:0):0)},0);
    const out=sp+inv+emi;bal=bal+inc-out;
    rows.push({k:k,lbl:monthName(k,true),full:monthName(k),bal:bal,inc:inc,out:out,emi:emi});
  }
  const low=rows.reduce((a,r)=>r.bal<a.bal?r:a,rows[0]);
  return {rows:rows,inc:inc,sp:sp,inv:inv,spNote:spNote,low:low,autoInc:src,autoSp:avgSp,autoInv:avgInv};
}

/* ---------- Net worth ---------- */
function worthData(){
  const st=S.settings,T=totals(),sh=st.shop;

  if(+sh.value>0)assets.push(['Shop property',+sh.value,0]);

  return {assets:assets,liabs:liabs,A:A,L:L,nw:A-L};
}

/* ---------- Investments ---------- */
function returnsFor(t){
  const b=invByType(),st=S.settings,fl=[];
  const types=t==='all'?INVT:[t];
  for(const ty of types){
    const x=b[ty];
    if(x.open>0){if(!st.invDate)return {why:'Set the date you started holding'};fl.push({d:new Date(st.invDate),a:-x.open})}
    Object.keys(S.months).forEach(k=>S.months[k].forEach(e=>{if(e.t==='inv'&&e.c===ty)fl.push({d:new Date(e.d),a:-e.a})}));
    if(x.tot>0)fl.push({d:TODAY,a:x.now});
  }
  if(!fl.length)return {why:'—'};
  const r=xirr(fl);return r==null?{why:'Needs 3+ months of history'}:{r:r};
}

/* ---------- Loans ---------- */
function schedRows(l){
  const r=amort(l.balance,l.rate,l.emi,0,0),off=ents(THIS).some(e=>e.t==='emi'&&e.l===l.id)?1:0;
  return r.rows.map(x=>Object.assign(x,{lbl:monthName(shiftKey(THIS,x.n-1+off),true)+' '+shiftKey(THIS,x.n-1+off).slice(2,4)}));
}
function payoffCard(L){
  const act=L.filter(l=>l.balance>0);if(!act.length)return '';
  const snow=S.payoff==='snow',ord=act.slice().sort((a,b)=>snow?a.balance-b.balance:b.rate-a.rate);
  return sect('Payoff order','<div class="chips" style="margin-bottom:10px"><button class="chip" data-act="payoff" data-m="ava" aria-pressed="'+(!snow)+'">Avalanche: highest rate first</button><button class="chip" data-act="payoff" data-m="snow" aria-pressed="'+snow+'">Snowball: smallest balance first</button></div><ul class="list cures">'+
    ord.map((l,i)=>'<li><div class="t">'+(i+1)+'. '+esc(l.name)+'</div>'+(l.rate>=15?'<span class="pill c">✕ High interest</span>':'<span class="pill n">'+l.rate+'%</span>')+'<div class="d">'+INR(l.balance)+' left at '+l.rate+'% a year'+(i===0?'. Pay the EMI on every loan, then put each spare rupee here.':'')+'</div></li>').join('')+
    '</ul><p class="sm muted" style="margin:10px 0 0">'+(snow?'Snowball clears small balances fast, which keeps you motivated.':'Avalanche costs the least interest.')+' When a loan clears, add its EMI to the next one. Debt above 15% a year comes before new investing.</p>');
}

/* ---------- Shop rental ---------- */
function viewShop(){
  const st=S.settings,sh=st.shop,src=st.income.find(x=>x.id==='rental')||st.income.find(x=>/rent/i.test(x.name)),rent=src?src.amt:0;
  const keys=lastKeys(THIS,12),due=+sh.due||1;
  const rows=keys.map(k=>{
    const recv=ents(k).filter(e=>e.t==='inc'&&src&&(e.rid===src.id||e.c===src.name)).reduce((a,e)=>a+e.a,0);
    const vac=!!sh.vacant[k],exp=vac?0:rent,costs=ents(k).filter(e=>e.t==='exp'&&e.c==='Shop costs').reduce((a,e)=>a+e.a,0);
    const overdue=k<THIS||(k===THIS&&TODAY.getDate()>=due);
    let status;
    if(vac)status='<span class="pill n">Vacant</span>';
    else if(exp>0&&recv>=exp*0.99)status='<span class="pill g">✓ Received</span>';
    else if(recv>0)status='<span class="pill w">! Part paid</span>';
    else if(!overdue)status='<span class="pill n">Due on the '+due+'th</span>';
    else status='<span class="pill c">✕ Pending</span>';
    return {k:k,recv:recv,vac:vac,exp:exp,costs:costs,status:status,short:overdue&&!vac?Math.max(0,exp-recv):0};
  });
  const coll=rows.reduce((a,r)=>a+r.recv,0),costs=rows.reduce((a,r)=>a+r.costs,0),net=coll-costs,pend=rows.reduce((a,r)=>a+r.short,0),vacN=rows.filter(r=>r.vac).length;
  const yld=+sh.value>0?net/+sh.value*100:null;
  return banner()+
  '<section class="tiles">'+
    tile('shop','t3','Rent collected',INR(coll),'Last 12 months')+
    tile('cart','t2','Shop costs',INR(costs),'Repairs, tax, upkeep')+
    tile('coins','t1','Net income',INR(net),yld!=null?'Net yield '+yld.toFixed(1)+'% a year':'Add the property value for yield')+
    tile('bell','t4','Pending',INR(pend),vacN?vacN+' vacant month'+(vacN>1?'s':''):'No vacant months')+'</section>'+
  sect('Rent, month by month','<p class="hint">Log shop repairs and property tax with the category Shop costs. Rent received is the income from your '+esc(src?src.name:'rental')+' source.</p><div class="tw"><table><thead><tr><th>Month</th><th class="r">Expected</th><th class="r">Received</th><th>Status</th><th></th></tr></thead><tbody>'+
    rows.slice().reverse().map(r=>'<tr><td>'+monthName(r.k)+'</td><td class="r">'+(r.vac?'—':INR(r.exp))+'</td><td class="r">'+INR(r.recv)+'</td><td>'+r.status+'</td><td class="r">'+(src&&!r.vac&&r.recv<r.exp*0.99&&(r.k<=THIS)?'<button class="btn sm" data-act="shoprecv" data-k="'+r.k+'">Mark received</button> ':'')+'<button class="btn sm ghost" data-act="shopvac" data-k="'+r.k+'">'+(r.vac?'Mark let':'Mark vacant')+'</button></td></tr>').join('')+'</tbody></table></div>')+
  sect('Shop details','<div class="form" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label>Monthly rent<input class="ctl" id="sh-rent" inputmode="decimal" value="'+(rent||'')+'" '+(src?'':'disabled')+' placeholder="0"></label><label>Rent due day<input class="ctl" id="sh-due" inputmode="numeric" value="'+due+'"></label><label>Property value<input class="ctl" id="sh-value" inputmode="decimal" value="'+(sh.value||'')+'" placeholder="0"></label><label>Deposit held for tenant<input class="ctl" id="sh-deposit" inputmode="decimal" value="'+(sh.deposit||'')+'" placeholder="0"></label><label class="wide" style="grid-column:1/-1">Tenant<input class="ctl" id="sh-tenant" value="'+esc(sh.tenant)+'" placeholder="Name or business"></label></div><p class="sm muted" style="margin:10px 0 0">Property value and deposit feed your net worth. The deposit counts as money you owe.</p>');

let assetsP=null;
const assetsNs=()=>assetsP||(assetsP=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use('assets'):null}catch(e){return null}})());
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('arkad-proofs',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(id,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function idbGet(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function idbDel(id){const d=await idb();return new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res();t.onerror=()=>res()})}
function shrink(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.74);
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('read'))};im.src=u;
  });
}
async function saveBlob(blob){
  const A=await assetsNs();
  if(A){try{const r=await A.upload(blob);return 'a:'+r.id}catch(e){}}
  if(GH.on()){try{const gid=uid(),b64=bufB64(await blob.arrayBuffer());await GH.run(()=>ghPutFile('photos/'+gid+'.jpg',b64,'Add photo'));idbPut('g'+gid,blob).catch(()=>{});return 'g:'+gid}catch(e){}}
  const id=uid();await idbPut(id,blob);return 'i:'+id;
}
async function addProofs(files,meta){
  const ids=[];let failed=0;
  for(const f of files){
    try{const b=await shrink(f),ref=await saveBlob(b),p=Object.assign({id:uid(),ref:ref,at:TODAYS},meta);S.settings.proofs.push(p);ids.push(p.id)}
    catch(e){failed++}
  }
  if(ids.length)save('settings');
  return {ids:ids,failed:failed};
}
const proofOf=id=>S.settings.proofs.find(p=>p.id===id);
const srcCache={};
async function srcOf(ref){
  if(srcCache[ref])return srcCache[ref];
  let u=null;
  if(ref[0]==='a')u='/_blob/'+ref.slice(2);
  else if(ref[0]==='g'){const b=await blobOf(ref);if(b)u=URL.createObjectURL(b)}
  else{const b=await idbGet(ref.slice(2));if(b)u=URL.createObjectURL(b)}
  if(u)srcCache[ref]=u;return u;
}
async function blobOf(ref){
  if(ref[0]==='g'){
    const id=ref.slice(2),c=await idbGet('g'+id).catch(()=>null);if(c)return c;
    const b=await (await ghReq('GET','photos/'+id+'.jpg',null,true)).blob();idbPut('g'+id,b).catch(()=>{});return b;
  }
  if(ref[0]==='a'){const r=await fetch('/_blob/'+ref.slice(2));if(!r.ok)throw new Error('fetch');return r.blob()}
  return idbGet(ref.slice(2));
}
function hydrate(root){$$('img[data-ref]',root||document).forEach(im=>{if(im.dataset.ok)return;srcOf(im.dataset.ref).then(u=>{if(u){im.src=u;im.dataset.ok='1'}}).catch(()=>{})})}
async function delProof(id){
  const p=proofOf(id);if(!p)return;
  try{
    if(p.ref[0]==='a'){const A=await assetsNs();if(A)await A.delete(p.ref.slice(2))}
    else if(p.ref[0]==='g'){const path='photos/'+p.ref.slice(2)+'.jpg';await GH.run(async()=>{const sha=(await (await ghReq('GET',path)).json()).sha;await ghReq('DELETE',path,{message:'Delete photo',sha:sha})});await idbDel('g'+p.ref.slice(2))}
    else await idbDel(p.ref.slice(2));
  }catch(e){}
  S.settings.proofs=S.settings.proofs.filter(x=>x.id!==id);
  if(p.eid&&p.ek){const e=(S.months[p.ek]||[]).find(x=>x.id===p.eid);if(e&&e.ph){e.ph=e.ph.filter(x=>x!==id);if(!e.ph.length)delete e.ph;saveMonth(p.ek)}}
  save('settings');
}

/* ---------- report ---------- */
function periodOf(r){
  const y=TODAY.getFullYear(),m=TODAY.getMonth(),fy=m>=3?y:y-1;
  const f=a=>({from:a+'-04-01',to:(a+1)+'-03-31',label:'FY '+a+'-'+String(a+1).slice(2)});
  if(r.p==='thism')return {from:THIS+'-01',to:THIS+'-31',label:monthName(THIS)};
  if(r.p==='lastm'){const k=shiftKey(THIS,-1);return {from:k+'-01',to:k+'-31',label:monthName(k)}}
  if(r.p==='fy')return f(fy);
  if(r.p==='lfy')return f(fy-1);
  if(r.p==='cy')return {from:y+'-01-01',to:y+'-12-31',label:String(y)};
  return {from:r.from||'2000-01-01',to:r.to||TODAYS,label:(r.from?dayLabel(r.from)+' '+r.from.slice(0,4):'the start')+' to '+(r.to?dayLabel(r.to)+' '+r.to.slice(0,4):'today')};
}
function periodEnts(P){
  const out=[];Object.keys(S.months).sort().forEach(k=>S.months[k].forEach(e=>{if(e.d>=P.from&&e.d<=P.to)out.push(e)}));
  return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
function repStats(L){
  const s={inc:0,exp:0,emi:0,inv:0,cat:{},src:{},mon:{}};
  L.forEach(e=>{
    const k=e.d.slice(0,7),m=s.mon[k]||(s.mon[k]={inc:0,exp:0,emi:0,inv:0});
    if(e.t==='inc'){s.inc+=e.a;m.inc+=e.a;s.src[e.c]=(s.src[e.c]||0)+e.a}
    else if(e.t==='exp'){s.exp+=e.a;m.exp+=e.a;s.cat[e.c]=(s.cat[e.c]||0)+e.a}
    else if(e.t==='emi'){s.emi+=e.a;m.emi+=e.a}
    else if(e.t==='inv'){s.inv+=e.a;m.inv+=e.a}
  });
  s.kept=s.inc-s.exp-s.emi;return s;
}

const pdfINR=n=>(n<0?'-':'')+'Rs '+Math.round(Math.abs(n)).toLocaleString('en-IN');
async function loadPdfLibs(){
  const load=src=>new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc)});
  const first=async u=>{for(const x of u){try{await load(x);return}catch(e){}}throw new Error('load')};
  if(!window.jspdf)await first(['vendor/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']);
  if(!window.jspdf.jsPDF.API.autoTable)await first(['vendor/jspdf.plugin.autotable.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js']);
}
const toDataUrl=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
const imgSize=u=>new Promise(res=>{const i=new Image();i.onload=()=>res([i.naturalWidth,i.naturalHeight]);i.onerror=()=>res([4,3]);i.src=u});
async function buildReport(){
  await loadPdfLibs();
  const jsPDF=window.jspdf.jsPDF,doc=new jsPDF({unit:'mm',format:'a4'}),r=S.rep,P=periodOf(r),L=periodEnts(P),s=repStats(L),T=totals(),st=S.settings;
  const M=14,G=[10,107,85];let cy=18;
  const need=h=>{if(cy+h>282){doc.addPage();cy=18}};
  const head=t=>{need(16);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(20,30,26);doc.text(t,M,cy);cy+=3};
  const tbl=(h,b,o)=>{
    o=o||{};const right=o.right||[];
    doc.autoTable({startY:cy,head:[h],body:b,margin:{left:M,right:M},theme:'striped',styles:{fontSize:9,cellPadding:2,textColor:[30,40,36]},headStyles:{fillColor:G,textColor:255},
      columnStyles:o.cs||{},didParseCell:d=>{if(right.indexOf(d.column.index)>=0)d.cell.styles.halign='right'}});
    cy=doc.lastAutoTable.finalY+9;
  };
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor(10,107,85);doc.text('Arkad Ledger',M,cy);
  doc.setFontSize(11);doc.setTextColor(90,100,96);doc.setFont('helvetica','normal');cy+=7;doc.text('Money report · '+P.label,M,cy);
  cy+=5;doc.setFontSize(9);doc.text('Generated '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+' · amounts in Indian rupees (Rs)',M,cy);cy+=9;
  head('Summary');
  tbl(['Item','Amount'],[
    ['Income',pdfINR(s.inc)],['Expenses',pdfINR(s.exp)],['EMI paid',pdfINR(s.emi)],['Invested',pdfINR(s.inv)],
    ['Kept (income minus expenses and EMI)',pdfINR(s.kept)+(s.inc>0?'  ('+pc(s.kept/s.inc)+' of income)':'')],
    ['Entries in this period',String(L.length)]],{right:[1]});
  head('Position today');
  tbl(['Item','Amount'],[
    ].concat(st.banks.map(b=>[b.name,pdfINR(T.acc[b.id])]),[['Cash in hand',pdfINR(T.acc.cash)],['Net balance',pdfINR(T.net)],
    ['Investments incl. FD/RD, current value',pdfINR(T.value)],['Loan balance left',pdfINR(T.loan)]]),{right:[1]});
  const srcs=Object.entries(s.src).sort((a,b)=>b[1]-a[1]);
  if(srcs.length){head('Income by source');tbl(['Source','Amount'],srcs.map(x=>[x[0],pdfINR(x[1])]),{right:[1]})}
  const cats=Object.entries(s.cat).sort((a,b)=>b[1]-a[1]);
  if(cats.length){head('Where the money went');tbl(['Category','Amount','Share'],cats.map(x=>[x[0],pdfINR(x[1]),pc(x[1]/s.exp)]),{right:[1,2]})}
  const mons=Object.keys(s.mon).sort();
  if(mons.length>1){head('Month by month');tbl(['Month','Income','Spent','Invested','Kept'],mons.map(k=>{const m=s.mon[k];return [monthName(k),pdfINR(m.inc),pdfINR(m.exp+m.emi),pdfINR(m.inv),pdfINR(m.inc-m.exp-m.emi)]}),{right:[1,2,3,4]})}
  if(r.tx&&L.length){
    head('All entries');
    tbl(['Date','Type','Category','Note','Account','Amount','Proof'],L.map(e=>{
      const pos=e.t==='inc'||(e.t==='adj'&&e.a>0),n=(e.ph&&e.ph.filter(proofOf).length)||0;
      return [dayLabel(e.d)+' '+e.d.slice(2,4),TYPES[e.t],e.t==='xfer'?xfLabel(e):e.c,e.n||'',e.t==='xfer'?'':accName(e.ac),(pos?'+':e.t==='xfer'?'':'-')+pdfINR(Math.abs(e.a)).replace('-',''),n?n+' photo'+(n>1?'s':''):''];
    }),{right:[5],cs:{3:{cellWidth:38}}});
  }
  if(r.ph){
    const items=[];L.forEach(e=>(e.ph||[]).forEach(id=>{const p=proofOf(id);if(p)items.push({p:p,e:e})}));
    if(items.length){
      doc.addPage();cy=18;head('Proof photos');cy+=2;
      const use=items.slice(0,60);let col=0,rowTop=cy;
      for(const it of use){
        let du=null;try{du=await toDataUrl(await blobOf(it.p.ref))}catch(e){}
        const x=M+col*94;
        if(col===0){if(rowTop+98>285){doc.addPage();rowTop=18}}
        doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(30,40,36);
        doc.text(((it.p.title||'Proof')+'').slice(0,46),x,rowTop+3);
        doc.setFont('helvetica','normal');doc.setTextColor(90,100,96);doc.text(dayLabel(it.e.d)+' '+it.e.d.slice(0,4)+' · '+pdfINR(it.e.a).replace('-','')+' · '+(it.e.t==='xfer'?xfLabel(it.e):it.e.c),x,rowTop+7.5);
        if(du){const [w,h]=await imgSize(du),k=Math.min(88/w,82/h);doc.addImage(du,'JPEG',x,rowTop+10,w*k,h*k)}
        else{doc.setTextColor(150,60,40);doc.text('Photo could not be loaded',x,rowTop+20)}
        col++;if(col===2){col=0;rowTop+=98}
      }
      if(items.length>60){const pg=doc.getNumberOfPages();doc.setPage(pg);doc.setFontSize(9);doc.setTextColor(90,100,96);doc.text('Showing the first 60 of '+items.length+' photos. Open the Proofs page for the rest.',M,290)}
    }
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120,130,126);doc.setFont('helvetica','normal');doc.text('Arkad Ledger · '+P.label,M,291);doc.text('Page '+i+' of '+n,196,291,{align:'right'})}
  return doc.output('blob');
}

const DEPKEY='Deposits (FD/RD)';
function addMonths(ds,n){
  const x=new Date(ds+'T00:00:00'),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);
  x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x;
}
const yrsBetween=(a,b)=>Math.max(0,(b-a)/31557600000);
function depCalc(d){
  const start=new Date(d.start+'T00:00:00'),n=Math.max(1,+d.months||1),end=addMonths(d.start,n),now=new Date(TODAYS+'T00:00:00'),stop=now<end?now:end,r=(+d.rate||0)/400;
  const g=(a,b)=>Math.pow(1+r,4*yrsBetween(a,b));
  let invested=0,value=0,maturity=0,paid=0;
  if(d.kind==='FD'){const P=+d.amt||0;maturity=P*g(start,end);if(now>=start){invested=P;value=P*g(start,stop);paid=1}}
  else{
    const m=+d.amt||0;
    for(let j=0;j<n;j++){const dj=addMonths(d.start,j);maturity+=m*g(dj,end);if(dj<=now){invested+=m;value+=m*g(dj,stop);paid++}}
  }
  const total=d.kind==='FD'?(+d.amt||0):(+d.amt||0)*n;
  return {invested:invested,value:value,maturity:maturity,end:end,matured:now>=end,paid:paid,n:n,active:now>=start&&now<end,interest:value-invested,
    left:Math.ceil((end-now)/864e5),pct:Math.max(0,Math.min(1,(now-start)/Math.max(1,end-start))),total:total};
}
function depTotals(){
  const o={invested:0,value:0,interest:0,n:0,next:null};
  (S.settings.deposits||[]).forEach(d=>{
    if(d.closed)return;const c=depCalc(d);o.invested+=c.invested;o.value+=c.value;o.interest+=c.interest;o.n++;
    if(!c.matured&&(!o.next||c.end<o.next.end))o.next={d:d,end:c.end,c:c};
  });
  return o;
}

function safeSpend(over){

  const exp=st.income.reduce((a,s)=>a+(+s.amt||0),0),target=Math.round(exp*(+st.payPct||0)/100),s=mstat(k),saveLeft=Math.max(0,target-s.inv-rds);

async function sendAsk(q){

  const st=S.settings;S.chat.push({r:'u',t:q});
  const rem=q.match(/^\s*(?:please\s+)?(?:remember|note(?: that)?|save a note)[:,\s]+(.+)$/i);
  if(rem){(st.notes||(st.notes=[])).push({id:uid(),d:TODAYS,t:rem[1].trim()});save('settings');S.chat.push({r:'a',t:'Saved your note: "'+rem[1].trim()+'". You can see or delete it under Your notes.'});render();return}
  if(/^\s*(show|list|what).{0,20}notes?\b/i.test(q)){const n=st.notes||[];S.chat.push({r:'a',t:n.length?'Your notes:\n'+n.map(x=>'- '+dayLabel(x.d)+': '+x.t).join('\n'):'You have no saved notes yet.'});render();return}
  const cfg=aiCfg(),canAi=!!cfg.key||!!(S.db&&window.claude&&window.claude.use);

  const hist=S.chat.slice(-12).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const clean=[];hist.forEach(m=>{if(clean.length&&clean[clean.length-1].role===m.role)clean[clean.length-1].content+='\n'+m.content;else clean.push(m)});
  try{
    const a=await askClaude(clean);
    S.chat.push({r:'a',t:a||(localAnswer(q)||LOCAL_HELP)});
  }catch(e){
    const bad=e.status===401?'Claude rejected the key. Check it under Connect Claude.':e.status===429?'Claude is busy or you have hit a usage limit. Try again in a moment.':(e.message||'Could not reach Claude. Check your internet connection.');
    const fb=localAnswer(q);
    S.chat.push({r:'a',t:bad+(fb?'\n\nFrom your own numbers:\n'+fb:''),err:1});
  }

}

function parseSms(){
  const tx=$('#qa-sms').value;if(!tx.trim()){toast('Paste a message first');return}
  const m=tx.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d+)?)/i)||tx.match(/([\d,]+\.\d{2})/);
  if(!m){toast('Could not find an amount in that message');return}
  const amt=num(m[1]),credit=/credited|received|deposited/i.test(tx)&&!/debited/i.test(tx),atm=/atm|cash withdrawal|withdrawn/i.test(tx);
  let who='';const w=tx.match(/\b(?:to|at|from|@)\s+([A-Za-z0-9][A-Za-z0-9 &._@-]{1,28}?)(?=\s+(?:on|ref|upi|via|using|has|is|from|dated)\b|[.,;(]|\s*$)/i);
  if(w)who=w[1].trim();
  const MAP=[[/swiggy|zomato|restaurant|cafe|pizza|burger|hotel|dominos|kfc/i,'Eating out'],[/uber|ola|rapido|metro|bmtc|fuel|petrol|diesel|fastag|irctc/i,'Transport'],[/amazon|flipkart|myntra|ajio|meesho/i,'Shopping'],[/netflix|prime|spotify|hotstar|youtube|subscription/i,'Subscriptions'],[/bigbasket|zepto|blinkit|dmart|grocer|supermarket|milk/i,'Groceries'],[/electric|bescom|airtel|jio|vi\b|recharge|bill|gas|water|broadband/i,'Utilities & bills'],[/pharma|apollo|hospital|clinic|medplus|lab/i,'Health']];
  const low=tx.toLowerCase();let bk=null;S.settings.banks.forEach(b=>{b.name.toLowerCase().split(/\W+/).filter(w=>w.length>=4&&w!=='bank').forEach(w=>{if(low.indexOf(w)>=0)bk=b.id})});
  const hit=MAP.find(x=>x[0].test(tx+' '+who));
  const dm=tx.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(dm){const yy=dm[3].length===2?'20'+dm[3]:dm[3],ds=yy+'-'+pad(dm[2])+'-'+pad(dm[1]);if(ds<=TODAYS&&!isNaN(new Date(ds)))$('#qa-date').value=ds,S.dateTouched=true}
  S.type=atm?'xfer':credit?'inc':'exp';S.qaCat=atm?(bk||accId('bank')):credit?(S.settings.income[0]?'':'Gift or other'):(hit?hit[1]:'Other');
  if(credit&&!hit)S.qaCat='Gift or other';
  $('#qa-amt').value=amt;if(who&&!atm)$('#qa-note').value=who;
  refreshSheet();pickAcc();if(atm)S.acc='cash';else if(bk)S.acc=bk;refreshSheet();

/* ---------- logging helpers ---------- */
function logSource(src,quiet){
  addEntry({id:uid(),d:defDate(),t:'inc',c:src.name,a:src.amt,n:'',ac:accId(src.ac||'bank'),rid:src.id,p:src.passive?1:0});
}
function reconcile(){
  const TA=totals().acc;let n=0;
  accList().forEach(x=>{
    const el=$('#rc-'+x[0]);if(!el)return;const val=num(el.value);if(isNaN(val))return;
    const diff=Math.round((val-TA[x[0]])*100)/100;
    if(Math.abs(diff)>=0.5){addEntry({id:uid(),d:TODAYS,t:'adj',c:'Adjustment',a:diff,n:'Matched '+x[1]+' to actual',ac:x[0]});n++}
  });
  S.settings.lastCheck=TODAYS;save('settings');render();
  toast(n?'Ledger matched. '+n+' adjustment'+(n>1?'s':'')+' logged.':'Already matches');
}

/* ---------- export and import ---------- */
async function offerFile(name,data){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:data});toast('Saved '+name);return}
  }catch(e){if(e&&e.code==='declined')return}
  try{const u=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Downloaded '+name)}
  catch(e){toast('Downloads are not available here')}
}
function exportCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=[['Date','Type','Category','Amount','Account','Note','Tax tag'].map(q).join(',')];
  Object.keys(S.months).sort().forEach(k=>S.months[k].slice().sort((a,b)=>a.d<b.d?-1:1).forEach(e=>rows.push([e.d,TYPES[e.t],e.t==='xfer'?xfLabel(e):e.c,e.a,e.t==='xfer'?'':accName(e.ac),e.n||'',e.tg?TAGS[e.tg]:''].map(q).join(','))));
  offerFile('arkad-entries-'+TODAYS+'.csv','﻿'+rows.join('\n'));
}
function backup(){
  offerFile('arkad-backup-'+TODAYS+'.json',JSON.stringify({app:'arkad',v:2,when:TODAYS,settings:S.settings,months:S.months}));
}
function readBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);if(!o||o.app!=='arkad'||!o.settings||!o.months)throw 0;
      S.importArm={data:o,n:Object.values(o.months).reduce((a,l)=>a+l.length,0),when:o.when||'an earlier date'};render();
    }catch(e){toast('That file is not an Arkad backup')}
  };
  r.readAsText(file);
}
function importGo(){
  const o=S.importArm.data;
  Object.keys(S.months).forEach(k=>{if(!o.months[k]){S.months[k]=[];saveMonth(k)}});
  S.settings=mergeSettings(o.settings);S.months=Object.assign(S.months,o.months);
  S.importArm=null;saveAllDocs();render();toast('Backup restored');
}
function resetAll(){
  (S.settings.proofs||[]).slice().forEach(p=>delProof(p.id));
  Object.keys(S.months).forEach(k=>{S.months[k]=[];saveMonth(k)});
  S.settings=defaults();S.settings.lastCheck=TODAYS;S.resetArm=false;save('settings');render();toast('All data deleted');
}

  if(el.id==='pq'){S.pq=el.value;keepFocus(render);return}
  if(el.id==='txq'){S.txQ=el.value;keepFocus(render);return}
  if(el.id==='qa-date'){S.dateTouched=true;return}
  if(el.id==='qa-note'){
    const m=st.memo[el.value.toLowerCase().trim()];
    if(m&&!$('#qa-amt').value){S.type=m.t;S.qaCat=m.c;S.acc=m.ac||'bank';$('#qa-amt').value=m.a;refreshSheet()}
    return}
  if(/^fc-(inc|sp|inv)$/.test(el.id)){st.forecast[el.id.slice(3)]=el.value;save('settings');keepFocus(render)}
});
document.addEventListener('change',ev=>{
  const el=ev.target,st=S.settings,d=el.dataset,id=el.id;if(!st)return;
  if(id==='ai-model'){const c=aiCfg();c.model=el.value;aiSave(c);return}
  if(id==='qa-photo'){Array.from(el.files||[]).forEach(f=>S.pending.push({file:f,url:URL.createObjectURL(f)}));el.value='';renderPrev();return}
  if(id==='attach-in'){
    const t=S.attachTo,files=Array.from(el.files||[]);el.value='';if(!t||!files.length)return;
    const en=(S.months[t.k]||[]).find(x=>x.id===t.id);if(!en)return;
    toast('Saving photos…');
    addProofs(files,proofMeta(en)).then(r=>{if(r.ids.length){en.ph=(en.ph||[]).concat(r.ids);saveMonth(t.k)}render();toast(r.ids.length?'Photo attached':'That photo could not be read')});
    return}
  if(id==='rp-from'||id==='rp-to'){S.rep[id==='rp-from'?'from':'to']=el.value;render();return}
  if(id==='rp-tx'||id==='rp-ph'){S.rep[id==='rp-tx'?'tx':'ph']=el.checked;return}
  let handled=true;
  if(d.bank){const b=st.banks.find(x=>x.id===d.bank);if(b){if(d.f==='name')b.name=el.value.trim()||b.name;else b.open=num(el.value)||0}}
  else if(d.loan){const l=st.loans.find(x=>x.id===d.loan);if(l)l[d.f]=el.value}
  else if(d.src){const s=st.income.find(x=>x.id===d.src);if(s){s[d.f]=d.f==='name'?el.value.trim()||s.name:d.f==='passive'?el.checked:d.f==='ac'?el.value:(num(el.value)||0)}}
  else if(d.rec){const r=st.recur.find(x=>x.id===d.rec);if(r)r[d.f]=d.f==='amt'?(num(el.value)||0):d.f==='name'?(el.value.trim()||r.name):el.value}
  else if(d.bud){const n=num(el.value);if(n>0)st.budgets[d.bud]=n;else delete st.budgets[d.bud]}
  else if(d.inv){const x=st.inv[d.inv]||(st.inv[d.inv]={});if(d.f==='cls')x.cls=el.value;else x[d.f]=num(el.value)||0}
  else if(d.alloc){st.alloc[d.alloc]=num(el.value)||0}
  else if(d.cover){st.cover[d.cover]=el.checked}
  else if(d.sim){const o=S.sim[d.sim]||(S.sim[d.sim]={});o[d.f]=el.value}
  else if(id==='paypct')st.payPct=Math.max(0,Math.min(90,num(el.value)||0));
  else if(id==='efm')st.efMonths=+el.value;
  else if(id==='opening')st.opening=num(el.value)||0;
  else if(id==='openCash')st.openCash=num(el.value)||0;
  else if(id==='taxpay')st.taxPay80c=num(el.value)||0;
  else if(id==='tax80d')st.tax80dLimit=+el.value;
  else if(id==='weekly')st.weekly=el.checked;
  else if(id==='invdate')st.invDate=el.value;
  else if(id==='sh-rent'){const s=st.income.find(x=>x.id==='rental')||st.income.find(x=>/rent/i.test(x.name));if(s)s.amt=num(el.value)||0}
  else if(id==='sh-due')st.shop.due=Math.max(1,Math.min(28,parseInt(el.value,10)||1));
  else if(id==='sh-value')st.shop.value=num(el.value)||0;
  else if(id==='sh-deposit')st.shop.deposit=num(el.value)||0;
  else if(id==='sh-tenant')st.shop.tenant=el.value.trim();
  else if(id==='imp'){if(el.files&&el.files[0])readBackup(el.files[0]);el.value='';return}
  else handled=false;
  if(handled){save('settings');render()}
});
document.addEventListener('pointerover',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),ev.clientX,ev.clientY)});
document.addEventListener('pointermove',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),ev.clientX,ev.clientY);else hideTip()});
document.addEventListener('pointerleave',hideTip,true);
window.addEventListener('scroll',hideTip,{passive:true});
document.addEventListener('keydown',ev=>{
  if(S.pv){if(ev.key==='Escape')closeViewer();else if(ev.key==='ArrowLeft')act('pvprev',document.body);else if(ev.key==='ArrowRight')act('pvnext',document.body);return}
  if(ev.key==='Escape'){if(S.sheet)closeSheet();$('#menubg').hidden=true;return}
  const tg=ev.target.tagName;
  if(ev.key==='n'&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey&&!/INPUT|TEXTAREA|SELECT/.test(tg)&&!S.sheet&&S.settings&&$('#lock').hidden){ev.preventDefault();openSheet()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ghFlush();ghRefresh()}});
window.addEventListener('online',()=>{ghFlush();ghRefresh(true)});
let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,150)});

/* ---------- boot ---------- */
applyTheme();
assetsNs().then(a=>{S.photoMode=a?'account':'browser'});
load().then(()=>{render();showLock();ghFlush()}).catch(e=>{$('#view').innerHTML='<div class="card"><div class="empty">Something went wrong while loading. Please reload the page.</div></div>';console.error(e)});
})();
</script>
